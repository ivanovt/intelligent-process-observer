name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://ipo:ipo@localhost:5432/ipo_test
      IPO_TEST_DATABASE_URL: postgresql+psycopg://ipo:ipo@localhost:5432/ipo_test
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18-bookworm
        env:
          POSTGRES_USER: ipo
          POSTGRES_PASSWORD: ipo
          POSTGRES_DB: ipo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ipo -d ipo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install uv

      - name: Sync backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Verify PostgreSQL vector extension
        working-directory: backend
        run: >-
          uv run --no-sync python -c
          "import psycopg; connection = psycopg.connect('postgresql://ipo:ipo@localhost:5432/ipo_test');
          cursor = connection.cursor(); cursor.execute('CREATE EXTENSION IF NOT EXISTS vector'); connection.commit();"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Install OpenSpec CLI
        run: npm install -g @fission-ai/openspec@latest

      - name: Run repository checks
        run: make check
