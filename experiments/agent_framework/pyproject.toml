[project]
name = "ipo-agent-framework-experiment"
version = "0.1.0"
description = "PydanticAI versus LangChain evaluation for the bounded Alert Analysis Agent."
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.3,<2",
    "langchain-openai>=1.4,<2",
    "pydantic>=2.13,<3",
    "pydantic-ai-slim[openai]>=2,<3",
]

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "ruff>=0.16,<0.17",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
