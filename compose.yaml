services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ipo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ipo}
      POSTGRES_DB: ${POSTGRES_DB:-ipo}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB && psql -U $$POSTGRES_USER -d $$POSTGRES_DB -c 'CREATE EXTENSION IF NOT EXISTS vector'",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
