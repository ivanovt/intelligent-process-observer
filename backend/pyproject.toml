[project]
name = "intelligent-process-observer-backend"
version = "0.1.0"
description = "Backend for Intelligent Process Observer."
requires-python = ">=3.13"
dependencies = [
    "alembic",
    "fastapi",
    "pydantic-settings",
    "psycopg[binary]",
    "sqlalchemy",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
